name: tests
on: [push, pull_request]
jobs:
  unit:
    # macOS: the kernel-level sandbox is sandbox-exec and three tests assert its behaviour
    # (probe logging, SIGXCPU on CPU limit); on Linux they fail for platform reasons, not bugs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q

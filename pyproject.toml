[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlvr"
version = "0.1.0"
description = "RLVR code-generation experiments — verifier-adequacy instrumentation (docs/07)"
requires-python = ">=3.11"
dependencies = [
    "evalplus>=0.3.1,<0.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-rerunfailures>=14",
    "hypothesis>=6",
]
gen = [
    "mlx-lm>=0.31",
]

[tool.setuptools]
packages = ["rlvr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
